name: CI Pipeline

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master, staging]

jobs:
  lint-and-format:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.9.1

      - name: Cache pnpm Store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Formatting
        run: pnpm format:check

      - name: Lint Workspace
        run: pnpm -r lint

  test:
    name: Unit & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.9.1

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @wpd/api db:generate

      - name: Build Shared Types
        run: pnpm --filter @wpd/shared build

      - name: Run Test Suite
        run: pnpm -r test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_key_minimum_32_characters_long
          AADHAAR_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          AADHAAR_HMAC_SECRET: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210

  build:
    name: Production Builds
    runs-on: ubuntu-latest
    needs: [lint-and-format, test]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.9.1

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build All Monorepo Projects
        run: pnpm -r build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
