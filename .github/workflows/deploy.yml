name: Production CD Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  db-migrate:
    name: Database Migration (Pre-deployment)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.9.1

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Prisma Migrations
        run: pnpm --filter @wpd/api db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [db-migrate]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}

      - name: Build & Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}

  deploy:
    name: Zero-Downtime Deployment
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment: production
    steps:
      - name: Deploy to Cloud Cluster
        run: |
          echo "Triggering zero-downtime rolling update with new container images..."
          # Rolling update via Kubernetes or Container Service

      - name: Health Check & Verification
        run: |
          echo "Waiting for healthcheck response from /health..."
          # Probing live endpoint
          curl --fail --retry 10 --retry-delay 5 https://walkerpass.park.gov.in/health || exit 1
